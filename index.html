<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>InsuredCan — Best Life &amp; Health Insurance Quotes in Canada | Free Advisor</title>
    <meta name="description" content="Compare Canada&#39;s top life, health, critical illness &amp; disability insurance plans. Free quotes from 20+ insurers. Licensed advisors in Ontario, BC &amp; Alberta. No obligation.">
    <meta name="keywords" content="life insurance Canada, health insurance Canada, term life insurance, critical illness insurance, disability insurance, insurance broker Toronto, Canadian insurance quotes, best life insurance Canada 2026" />
    <meta name="author" content="InsuredCan" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://www.insuredcan.ca/" />

    <!-- Language / Locale -->
    <link rel="alternate" hreflang="en-CA" href="https://www.insuredcan.ca/" />
    <link rel="alternate" hreflang="x-default" href="https://www.insuredcan.ca/" />

    <!-- Preload Critical Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InsuredCan" />
    <meta property="og:title" content="InsuredCan — Best Life &amp; Health Insurance Quotes in Canada | Free Advisor">
    <meta property="og:description" content="Compare Canada&#39;s top life, health, critical illness &amp; disability insurance plans. Free quotes from 20+ insurers. Licensed advisors in Ontario, BC &amp; Alberta. No obligation.">
    <meta property="og:url" content="https://www.insuredcan.ca/" />
    <meta property="og:image" content="https://www.insuredcan.ca/og/og-home.png">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InsuredCan — Compare life and health insurance quotes in Canada" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InsuredCan — Best Life &amp; Health Insurance Quotes in Canada | Free Advisor">
    <meta name="twitter:description" content="Compare Canada&#39;s top life, health, critical illness &amp; disability insurance plans. Free quotes from 20+ insurers. Licensed advisors in Ontario, BC &amp; Alberta. No obligation.">
    <meta name="twitter:image" content="https://www.insuredcan.ca/og-image.png">
    <meta name="twitter:image:alt" content="InsuredCan — Compare life and health insurance quotes in Canada" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Toronto, Canada" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InsuredCan",
      "url": "https://www.insuredcan.ca",
      "logo": "https://www.insuredcan.ca/favicon.ico",
      "description": "InsuredCan is a licensed Canadian insurance brokerage helping families, newcomers, and self-employed Canadians find affordable life, health, and critical illness coverage.",
      "areaServed": {"@type": "Country", "name": "Canada"},
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "areaServed": "CA",
        "availableLanguage": ["English", "French"]
      }
    }
    </script>

    <!-- Structured Data: InsuranceAgency (LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "InsuranceAgency",
      "name": "InsuredCan",
      "url": "https://www.insuredcan.ca",
      "logo": "https://www.insuredcan.ca/favicon.ico",
      "image": "https://www.insuredcan.ca/og-image.png",
      "description": "Licensed Canadian insurance broker offering life, health, critical illness, disability, travel, and mortgage protection insurance. Serving families across Ontario, BC, and Alberta.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Toronto",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "areaServed": [
        {"@type": "State", "name": "Ontario"},
        {"@type": "State", "name": "British Columbia"},
        {"@type": "State", "name": "Alberta"},
        {"@type": "Country", "name": "Canada"}
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "2300",
        "bestRating": "5",
        "worstRating": "1"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Insurance Products",
        "itemListElement": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Life Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Critical Illness Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Disability Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Health Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Travel Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Mortgage Protection Insurance"}}
        ]
      },
      "speakable": {
        "@type": "SpeakableSpecification",
        "cssSelector": ["h1", ".hero-description", ".trust-stats"]
      }
    }
    </script>

    <!-- Structured Data: WebSite with Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "InsuredCan",
      "url": "https://www.insuredcan.ca",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.insuredcan.ca/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
