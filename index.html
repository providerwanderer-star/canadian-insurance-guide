<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>InsuredCan — Best Life & Health Insurance Quotes in Canada | Free Advisor</title>
    <meta name="description" content="Compare Canada's top life, health, critical illness & disability insurance plans. Free quotes from 20+ insurers. Licensed advisors in Ontario, BC & Alberta. No obligation." />
    <meta name="keywords" content="life insurance Canada, health insurance Canada, term life insurance, critical illness insurance, disability insurance, insurance broker Toronto, Canadian insurance quotes" />
    <meta name="author" content="InsuredCan" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://insuredcan.ca/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InsuredCan" />
    <meta property="og:title" content="InsuredCan — Best Life & Health Insurance Quotes in Canada" />
    <meta property="og:description" content="Compare Canada's top life, health, critical illness & disability insurance plans. Free quotes. Licensed advisors. 5,000+ families protected." />
    <meta property="og:url" content="https://insuredcan.ca/" />
    <meta property="og:image" content="https://insuredcan.ca/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InsuredCan — Best Life & Health Insurance Quotes in Canada" />
    <meta name="twitter:description" content="Compare Canada's top life, health & critical illness plans. Free quotes. Licensed advisors." />
    <meta name="twitter:image" content="https://insuredcan.ca/og-image.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="CA" />
    <meta name="geo.placename" content="Canada" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InsuredCan",
      "url": "https://insuredcan.ca",
      "logo": "https://insuredcan.ca/favicon.ico",
      "description": "InsuredCan is a licensed Canadian insurance brokerage helping families, newcomers, and self-employed Canadians find affordable life, health, and critical illness coverage.",
      "areaServed": {"@type": "Country", "name": "Canada"},
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "areaServed": "CA",
        "availableLanguage": ["English", "French"]
      }
    }
    </script>

    <!-- Structured Data: InsuranceAgency (LocalBusiness) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "InsuranceAgency",
      "name": "InsuredCan",
      "url": "https://insuredcan.ca",
      "logo": "https://insuredcan.ca/favicon.ico",
      "image": "https://insuredcan.ca/og-image.png",
      "description": "Licensed Canadian insurance broker offering life, health, critical illness, disability, travel, and mortgage protection insurance. Serving families across Ontario, BC, and Alberta.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Toronto",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "areaServed": [
        {"@type": "State", "name": "Ontario"},
        {"@type": "State", "name": "British Columbia"},
        {"@type": "State", "name": "Alberta"},
        {"@type": "Country", "name": "Canada"}
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "2300",
        "bestRating": "5",
        "worstRating": "1"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Insurance Products",
        "itemListElement": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Life Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Critical Illness Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Disability Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Health Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Travel Insurance"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Mortgage Protection Insurance"}}
        ]
      }
    }
    </script>

    <!-- Structured Data: WebSite with Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "InsuredCan",
      "url": "https://insuredcan.ca",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://insuredcan.ca/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
